upstream django {
    server web:8000;
}


server {
    listen 80;

    server_name _;

    server_tokens off;

    client_max_body_size 20M;


    gzip on;

    gzip_vary on;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml;


    location = /api {
        return 301 /api/;
    }


    location = /admin {
        return 301 /admin/;
    }


    location /api/ {
        proxy_pass http://django;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $scheme;

        proxy_set_header X-Forwarded-Host
            $host;

        proxy_redirect off;

        proxy_connect_timeout 60;

        proxy_send_timeout 60;

        proxy_read_timeout 90;
    }


    location /admin/ {
        proxy_pass http://django;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $scheme;

        proxy_set_header X-Forwarded-Host
            $host;

        proxy_redirect off;

        proxy_connect_timeout 60;

        proxy_send_timeout 60;

        proxy_read_timeout 90;
    }


    location /static/ {
        alias /app/staticfiles/;

        expires 30d;

        access_log off;

        add_header Cache-Control "public";
    }


    location /media/ {
        alias /app/media/;

        expires 7d;

        access_log off;

        add_header Cache-Control "public";
    }


    location /assets/ {
        root /usr/share/nginx/html;

        expires 1y;

        access_log off;

        add_header
            Cache-Control
            "public, immutable";
    }


    location = /index.html {
        root /usr/share/nginx/html;

        expires -1;

        add_header
            Cache-Control
            "no-cache, no-store, must-revalidate";
    }


    location / {
        root /usr/share/nginx/html;

        try_files
            $uri
            $uri/
            /index.html;
    }
}

upstream django {
    server web:8000;
}


# =========================================================
# HTTP
# =========================================================

server {
    listen 80;

    server_name
        vitrinsbz.ir
        www.vitrinsbz.ir;


    # Let's Encrypt renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }


    # Redirect all normal HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# =========================================================
# HTTPS
# =========================================================

server {
    listen 443 ssl;

    http2 on;

    server_name
        vitrinsbz.ir
        www.vitrinsbz.ir;

    server_tokens off;

    client_max_body_size 20M;


    # =====================================================
    # TLS
    # =====================================================

    ssl_certificate
        /etc/letsencrypt/live/vitrinsbz.ir/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/vitrinsbz.ir/privkey.pem;

    ssl_protocols
        TLSv1.2
        TLSv1.3;

    ssl_ecdh_curve X25519:prime256v1;

    ssl_session_cache
        shared:SSL:10m;

    ssl_session_timeout
        1d;

    ssl_session_tickets off;


    # =====================================================
    # Security headers
    # =====================================================

    add_header
        X-Content-Type-Options
        "nosniff"
        always;

    add_header
        Referrer-Policy
        "same-origin"
        always;

    add_header
        Strict-Transport-Security
        "max-age=31536000; includeSubDomains"
        always;


    # =====================================================
    # API
    # =====================================================

    location = /api {
        return 301 /api/;
    }


    location /api/ {
        proxy_pass http://django;

        proxy_set_header Host $host;

        proxy_set_header
            X-Real-IP
            $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $scheme;

        proxy_set_header
            X-Forwarded-Host
            $host;

        proxy_redirect off;

        proxy_connect_timeout 60;

        proxy_send_timeout 60;

        proxy_read_timeout 90;
    }


    # =====================================================
    # Django Admin
    # =====================================================

    location = /admin {
        return 301 /admin/;
    }


    location /admin/ {
        proxy_pass http://django;

        proxy_set_header Host $host;

        proxy_set_header
            X-Real-IP
            $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $scheme;

        proxy_set_header
            X-Forwarded-Host
            $host;

        proxy_redirect off;

        proxy_connect_timeout 60;

        proxy_send_timeout 60;

        proxy_read_timeout 90;
    }


    # =====================================================
    # Django static
    # =====================================================

    location /static/ {
        alias /app/staticfiles/;

        expires 30d;

        access_log off;

        add_header
            Cache-Control
            "public";
    }


    # =====================================================
    # Django media
    # =====================================================

    location /media/ {
        alias /app/media/;

        expires 7d;

        access_log off;

        add_header
            Cache-Control
            "public";
    }


    # =====================================================
    # React assets
    # =====================================================

    location /assets/ {
        root /usr/share/nginx/html;

        expires 1y;

        access_log off;

        add_header
            Cache-Control
            "public, immutable";
    }


    # =====================================================
    # React index
    # =====================================================

    location = /index.html {
        root /usr/share/nginx/html;

        expires -1;

        add_header
            Cache-Control
            "no-cache, no-store, must-revalidate";
    }


    # =====================================================
    # React SPA
    # =====================================================

    location / {
        root /usr/share/nginx/html;

        try_files
            $uri
            $uri/
            /index.html;
    }

   location ~ /\.(?!well-known) {
       deny all;
       access_log off;
       log_not_found off;
    }

   location ~* \.(env|ini|log|sql|bak|conf)$ {
       deny all;
       access_log off;
       log_not_found off;
    }
}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vitrin_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitrin}
      POSTGRES_USER: ${POSTGRES_USER:-vitrin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitrin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitrin} -d ${POSTGRES_DB:-vitrin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vitrin_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Django (Gunicorn)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitrin_web
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-vitrin}:${POSTGRES_PASSWORD:-vitrin}@db:5432/${POSTGRES_DB:-vitrin}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net
    expose:
      - "8000"
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"

  # ---------------------------------------------------------------------------
  # Nginx (Reverse Proxy + Static/Media)
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: vitrin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - net

  # ---------------------------------------------------------------------------
  # Certbot (Let's Encrypt auto-renew)
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: vitrin_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;'
    networks:
      - net

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
  certbot_conf:
  certbot_www:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  net:
    driver: bridge
